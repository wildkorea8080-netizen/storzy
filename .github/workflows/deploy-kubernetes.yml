name: Deploy to Kubernetes

on:
  workflow_dispatch:
    inputs:
      image_reference:
        description: Immutable GHCR image reference with sha256 digest
        required: true
        type: string
      namespace:
        description: Existing Kubernetes namespace
        required: true
        default: storzy
        type: string
      base_url:
        description: Production HTTPS origin used for post-deploy verification
        required: true
        type: string
      workspace_id:
        description: Pilot workspace UUID (optional)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: storzy-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Migrate and roll out
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    env:
      IMAGE_REFERENCE: ${{ inputs.image_reference }}
      KUBE_NAMESPACE: ${{ inputs.namespace }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
      - name: Validate deployment inputs
        shell: bash
        run: |
          if [[ ! "$KUBE_NAMESPACE" =~ ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$ ]] || (( ${#KUBE_NAMESPACE} > 63 )); then
            echo "Namespace must be a valid Kubernetes DNS label." >&2
            exit 1
          fi
          npm run deploy:kubernetes -- "$IMAGE_REFERENCE" >/dev/null
      - name: Configure cluster credentials
        shell: bash
        env:
          KUBECONFIG_BASE64: ${{ secrets.KUBECONFIG_BASE64 }}
        run: |
          if [[ -z "$KUBECONFIG_BASE64" ]]; then
            echo "Required environment secret KUBECONFIG_BASE64 is not configured." >&2
            exit 1
          fi
          kubeconfig="$RUNNER_TEMP/storzy-kubeconfig"
          printf '%s' "$KUBECONFIG_BASE64" | base64 --decode > "$kubeconfig"
          chmod 600 "$kubeconfig"
          echo "KUBECONFIG=$kubeconfig" >> "$GITHUB_ENV"
      - name: Verify deployment prerequisites
        shell: bash
        run: |
          kubectl get namespace "$KUBE_NAMESPACE" >/dev/null
          kubectl --namespace "$KUBE_NAMESPACE" get secret storzy-runtime >/dev/null
      - name: Generate ordered manifests
        run: npm run deploy:kubernetes -- "$IMAGE_REFERENCE" --write
      - name: Apply and wait for migration
        shell: bash
        run: |
          migration_job="storzy-migrate-${IMAGE_REFERENCE: -12}"
          kubectl --namespace "$KUBE_NAMESPACE" apply -f storzy.migration.k8s.yaml
          if ! kubectl --namespace "$KUBE_NAMESPACE" wait --for=condition=complete "job/$migration_job" --timeout=10m; then
            kubectl --namespace "$KUBE_NAMESPACE" logs "job/$migration_job" --all-containers=true --tail=200 || true
            exit 1
          fi
      - name: Apply workloads
        run: kubectl --namespace "$KUBE_NAMESPACE" apply -f storzy.workloads.k8s.yaml
      - name: Wait for all deployments
        shell: bash
        run: |
          mapfile -t deployments < <(kubectl --namespace "$KUBE_NAMESPACE" get deployment -l app.kubernetes.io/name=storzy -o name)
          if (( ${#deployments[@]} != 10 )); then
            echo "Expected 10 STORZY deployments, found ${#deployments[@]}." >&2
            exit 1
          fi
          for deployment in "${deployments[@]}"; do
            kubectl --namespace "$KUBE_NAMESPACE" rollout status "$deployment" --timeout=10m
          done
      - name: Warm up and verify all schedulers
        shell: bash
        run: |
          schedulers=(
            storzy-privacy-sla-scan
            storzy-privacy-alert-delivery
            storzy-order-reconciliation
            storzy-shopify-token-alert-delivery
            storzy-admin-auth-retention
          )
          for scheduler in "${schedulers[@]}"; do
            kubectl --namespace "$KUBE_NAMESPACE" get "cronjob/$scheduler" >/dev/null
          done
          jobs=()
          for scheduler in "${schedulers[@]}"; do
            job="storzy-warm-${scheduler#storzy-}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            kubectl --namespace "$KUBE_NAMESPACE" create job --from="cronjob/$scheduler" "$job"
            jobs+=("$job")
          done
          for job in "${jobs[@]}"; do
            if ! kubectl --namespace "$KUBE_NAMESPACE" wait --for=condition=complete "job/$job" --timeout=5m; then
              kubectl --namespace "$KUBE_NAMESPACE" logs "job/$job" --all-containers=true --tail=200 || true
              exit 1
            fi
          done
      - name: Record deployed digest
        shell: bash
        run: echo "Deployed $IMAGE_REFERENCE to namespace $KUBE_NAMESPACE" >> "$GITHUB_STEP_SUMMARY"

  verify:
    name: Verify live deployment
    needs: deploy
    uses: ./.github/workflows/post-deploy-verify.yml
    with:
      base_url: ${{ inputs.base_url }}
      workspace_id: ${{ inputs.workspace_id }}
      expected_release: ${{ inputs.image_reference }}
      process_attempts: "18"
      process_retry_ms: "10000"
    secrets:
      ADMIN_API_TOKEN: ${{ secrets.ADMIN_API_TOKEN }}
