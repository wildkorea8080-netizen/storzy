name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run quality gate
        run: npm run check

  container:
    name: Build production container
    needs:
      - application
      - database
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build without publishing
        run: docker build --tag storzy:ci .

  database:
    name: Apply migrations twice
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: storzy_ci
          POSTGRES_USER: storzy
          POSTGRES_PASSWORD: storzy_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U storzy -d storzy_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://storzy:storzy_ci@127.0.0.1:5432/storzy_ci
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Apply all migrations
        run: npm run db:migrate
      - name: Verify idempotent reapplication
        run: npm run db:migrate
      - name: Verify migration checksums
        run: npm run db:migrate:verify
