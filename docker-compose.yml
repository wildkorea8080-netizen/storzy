services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: storzy
      POSTGRES_USER: storzy
      POSTGRES_PASSWORD: storzy
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storzy -d storzy"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - storzy-postgres:/var/lib/postgresql/data

volumes:
  storzy-postgres:

